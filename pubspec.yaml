name: rockets
description: Worldwide rocket launch tracker, satellite tracking, solar system explorer, and space news.
publish_to: 'none'
version: 0.10.0+11

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.0
  intl: ^0.19.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.4
  webview_flutter: ^4.7.0
  flutter_compass: ^0.8.1
  sensors_plus: ^7.1.0
  sgp4_sdp4: ^0.1.0
  geolocator: ^13.0.1
  permission_handler: ^13.0.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
