publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.0
  intl: ^0.19.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.4
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
